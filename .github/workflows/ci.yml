name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Pack conformance (PACKS.md §11)
        run: pnpm test:packs
      - name: CODEOWNERS is generated from manifests (PACKS.md §12)
        run: pnpm codeowners --check
      - run: pnpm build
