name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a newer push cancels the older run's leftover minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests with coverage floors (MILESTONES.md §4 decision 50)
        run: pnpm test:coverage
      - name: Pack conformance (PACKS.md §11)
        run: pnpm test:packs
      - name: CODEOWNERS is generated from manifests (PACKS.md §12)
        run: pnpm codeowners --check
      - name: No known high-severity vulnerability in the lockfile
        run: pnpm audit --audit-level=high
      - run: pnpm build

  # The real-database tier (MILESTONES.md §2 decision 8) against a Supabase
  # stack the job starts itself. It never skips: a missing variable or an
  # unreachable stack fails in lib/testing/stack.ts with the name of what is
  # missing.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack (migrations applied on start)
        run: supabase start -x logflare,studio,vector
      - name: Export the stack's keys under the names the app reads
        # `supabase status -o env` prints API_URL, ANON_KEY and SERVICE_ROLE_KEY;
        # the app and the harness read NEXT_PUBLIC_SUPABASE_URL,
        # NEXT_PUBLIC_SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY. Values are
        # the local stack's well-known development keys, never a real secret.
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "CRON_SECRET=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: lib/database.types.ts matches the applied migrations (run `pnpm db:types` if this fails)
        run: pnpm db:types && git diff --exit-code -- lib/database.types.ts
      - run: pnpm test:db
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # The browser tier (MILESTONES.md §4 decision 46, decision 40's
  # security-boundary journey). Like `db`, it starts its own stack and never
  # skips. It builds AFTER exporting the stack's keys: `NEXT_PUBLIC_*` is
  # inlined at build time, so `check`'s build cannot be reused here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack (migrations applied on start)
        run: supabase start -x logflare,studio,vector
      - name: Export the stack's keys under the names the app reads
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "CRON_SECRET=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Install the browser the journeys run in
        run: pnpm exec playwright install --with-deps chromium
      - name: Build what the journeys exercise (CI runs `pnpm start`)
        run: pnpm build
      - run: pnpm test:e2e
      - name: The report, when a journey failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # The production-data gate (MILESTONES.md, "Do not enter real portfolio data
  # until `pnpm release:check` passes"). It is the whole pyramid plus the
  # readiness script, so it runs on `main` only — `check`, `db` and `e2e`
  # already cover a pull request.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack (migrations applied on start)
        run: supabase start -x logflare,studio,vector
      - name: Export the stack's keys under the names the app reads
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "CRON_SECRET=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Install the browser the journeys run in
        run: pnpm exec playwright install --with-deps chromium
      - name: The gate itself
        run: pnpm release:check
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
